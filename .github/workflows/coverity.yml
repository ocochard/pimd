name: Coverity Scan

# Coverity's free tier caps how many builds a project may submit per week,
# and per day, so this does not run on push.  Once a week keeps a fresh
# analysis without spending the quota on every commit, and the manual
# trigger is there for when something is worth scanning right away.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: pimd
  # The project as Coverity Scan knows it, and the address it mails
  # results to.  Set the repository variables to override, so registering
  # under a different account does not need a commit.
  COVERITY_NAME: ${{ vars.COVERITY_PROJECT || 'ocochard/pimd' }}
  CONTACT_EMAIL: ${{ vars.COVERITY_EMAIL || 'olivier@cochard.me' }}

jobs:
  coverity:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the scan token is configured
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::COVERITY_SCAN_TOKEN is not set.  Register the project at"
            echo "::error::https://scan.coverity.com/ and add its token as a repository secret."
            exit 1
          fi
          # Coverity wants the project name form-encoded in the URL
          echo "COVERITY_PROJ=$(printf '%s' "$COVERITY_NAME" | sed 's|/|%2F|g')" >> "$GITHUB_ENV"

      - name: Fetch latest Coverity Scan MD5
        id: var
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          wget -q https://scan.coverity.com/download/cxx/linux64         \
               --post-data "token=$TOKEN&project=${COVERITY_PROJ}&md5=1" \
               -O coverity-latest.tar.gz.md5
          MD5=$(cat coverity-latest.tar.gz.md5)
          echo "Got MD5 $MD5"
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: cache
        with:
          path: coverity-latest.tar.gz
          key: ${{ runner.os }}-coverity-${{ steps.var.outputs.md5 }}
          restore-keys: |
            ${{ runner.os }}-coverity-${{ steps.var.outputs.md5 }}
            ${{ runner.os }}-coverity-
            ${{ runner.os }}-coverity

      - name: Download Coverity Scan
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          if [ ! -f coverity-latest.tar.gz ]; then
            wget -q https://scan.coverity.com/download/cxx/linux64   \
                 --post-data "token=$TOKEN&project=${COVERITY_PROJ}" \
                 -O coverity-latest.tar.gz
          else
            echo "Latest Coverity Scan available from cache :-)"
            md5sum coverity-latest.tar.gz
          fi
          mkdir coverity
          tar xzf coverity-latest.tar.gz --strip 1 -C coverity

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install pkg-config libsystemd-dev

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=

      - name: Build
        run: |
          export PATH=`pwd`/coverity/bin:$PATH
          cov-build --dir cov-int make

      - name: Submit results to Coverity Scan
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          tar czvf ${PROJECT_NAME}.tgz cov-int

          # Coverity answers 200 with the reason in the body when it turns
          # a build away - a project name it does not know, a quota already
          # spent - so curl's own exit status cannot tell acceptance from
          # rejection, and an unchecked upload leaves the job green while
          # nothing was analysed.  Demand both the status and the wording
          # it uses on success.
          code=$(curl --silent --show-error --write-out '%{http_code}' \
            --output response.txt \
            --form project="${COVERITY_NAME}" \
            --form token="$TOKEN" \
            --form email="${CONTACT_EMAIL}" \
            --form file=@${PROJECT_NAME}.tgz \
            --form version=trunk \
            --form description="${PROJECT_NAME} $(git rev-parse HEAD)" \
            "https://scan.coverity.com/builds?project=${COVERITY_PROJ}")
          cat response.txt

          if [ "$code" != "200" ]; then
            echo "::error::Coverity Scan returned HTTP $code, see the response above"
            exit 1
          fi
          if ! grep -qi "successfully submitted" response.txt; then
            echo "::error::Coverity Scan did not accept the build, see the response above"
            exit 1
          fi

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverity-build.log
          path: cov-int/build-log.txt
          if-no-files-found: ignore
