name: CI-FreeBSD

# GitHub has no FreeBSD runners, so everything here happens inside a VM on
# an Ubuntu host.  This is the only workflow that compiles routesock.c and
# the kern.c BSD branches at all: the Linux job in ci-linux.yml selects
# netlink.c instead, through the LINUX/BSD conditionals in src/Makefile.am,
# so half of the OS glue never sees a compiler there.
on:
  push:
    branches:
      - '**'
      - '!dev'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on FreeBSD ${{ matrix.release }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "15.1"
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build + smoke test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            # autoconf/automake for autogen.sh.  Nothing else: the build is
            # GNU autotools, but what automake generates is portable make,
            # so base system make(1) runs it and no gmake package is needed
            # here.  GNU make is covered by the Linux workflow.
            pkg install -y autoconf automake pkgconf

          run: |
            set -eux
            cd $GITHUB_WORKSPACE

            ./autogen.sh
            # --enable-werror in CI only: a release tarball built with
            # -Werror stops building on the next compiler release.
            ./configure --prefix= --enable-test --enable-werror
            make V=1

            # `make check` is not run because it would run nothing:
            # test/Makefile.am sets no TESTS at all, every script that was
            # there being a scenario of test/lab.sh now, which wants real
            # root and vnet jails and is the lab job below.
            DESTDIR=/tmp/inst make install-strip
            /tmp/inst/sbin/pimd -h
            /tmp/inst/sbin/pimctl -h

            # Enough to prove the daemon reaches the kernel: MRT_INIT is the
            # first thing it does that a build error or a missing BSD branch
            # would take out, and pimctl answering means the IPC socket and
            # the vif table came up.
            kldload -n ip_mroute
            /tmp/inst/sbin/pimd -p /tmp/pimd.pid -u /tmp/pimd.sock
            sleep 2
            /tmp/inst/sbin/pimctl -u /tmp/pimd.sock show interface
            /tmp/inst/sbin/pimctl -u /tmp/pimd.sock kill

  lab:
    # The vnet jail lab: twenty-five PIM-SM scenarios over real jails, epairs
    # and bridges, asserting on forwarded traffic and on the kernel MFC in
    # each vnet.  It is the only regression test that exercises the RPF
    # lookups in routesock.c and the kern.c BSD branches, rather than merely
    # compiling them, so without it every FreeBSD-specific line here is
    # covered by a compiler and nothing else.
    #
    # Even two at a time it is a long job, which is why it is one of its
    # own rather than another step of the build: the build reports in a few
    # minutes and does not wait for this.  VIMAGE is in GENERIC, so the only
    # setup needed is loading ip_mroute.ko and if_bridge.ko, which a jail
    # cannot do for itself.  The lab also sets a host-global sysctl
    # (net.inet.ip.mcast.loop) and restores it afterwards; in a throwaway VM
    # that costs nothing either way.
    name: Lab on FreeBSD ${{ matrix.release }} (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "15.1"
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the vnet jail lab in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            pkg install -y autoconf automake pkgconf

          run: |
            set -eux
            cd $GITHUB_WORKSPACE

            # The lab cannot kldload from inside a jail, so the modules have
            # to be in place before any of it starts.
            kldload -n ip_mroute
            kldload -n if_bridge
            sysctl -n kern.features.vimage

            ./autogen.sh
            ./configure --prefix= --enable-test
            make V=1

            # Already root in the VM, so the script's sudo wrapper is empty.
            #
            # Two scenarios at a time, each in a lab slot of its own.  The
            # numbers in lab.sh's header -- 4m35s at -j 4, and the
            # whole list at once under a load average of one -- were measured
            # on a 16-core host, and this runner has four vCPUs.  Every
            # assertion in the lab is a poll against a timeout, so on an
            # unmeasured machine a job count well under the core count is
            # the conservative read of them: what a slower lab loses is a
            # deadline, not just time.  -j 2 is most of the win regardless,
            # since keepalive has to outlive PIM_DATA_TIMEOUT and is a four
            # minute floor no job count moves.
            #
            # A scenario that fails keeps its work directory, which holds one
            # pimd log per router and the traffic captures.  copyback is off
            # and the VM goes away with the job, so print the logs here or
            # the run leaves nothing but the assertion that tripped.  The
            # slot is part of that directory's name -- slot 0 is
            # /tmp/pimd-test, slot 1 /tmp/pimd-test1 -- so the glob has to
            # reach past slot 0 or half the runs lose their logs.
            SUDO= sh test/lab.sh -j 2 run all || rc=$?

            for d in /tmp/pimd-test*.*.failed; do
                    test -d "$d" || continue
                    for f in "$d"/*.log; do
                            test -f "$f" || continue
                            echo "===== $f ====="
                            tail -n 200 "$f"
                    done
            done

            exit ${rc:-0}

  frr-interop:
    # The interop lab's other kernel.  ci-linux.yml runs the same three
    # scenarios over netns, and everything FreeBSD-specific they would
    # exercise -- routesock.c, the kern.c BSD branches, the jail backend of
    # lab-freebsd.sh -- is exactly what that job cannot reach.  A bug in
    # pimd's reading of a foreign implementation that only shows on this
    # half would otherwise be found by hand or not at all.
    #
    # net/frr10 has to be 10.7.1_1 or newer: FRR's pimd is built by that
    # revision of the port and by no earlier one, and the package before it
    # installs the daemons in sbin with no pimd among them at all.  The
    # official repositories are behind that today -- FreeBSD:15:amd64 is
    # 10.6.1 on quarterly and 10.7.1 on latest, neither of which has it --
    # so the job asks the installed package its version and says what it is
    # skipping rather than failing on something no commit here can fix.  It
    # starts running of its own accord once the builders catch up.
    name: FRR interop on FreeBSD ${{ matrix.release }} (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "15.1"
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the FRR interop lab in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            # A release VM points at the quarterly branch, which is a
            # release of FRR behind; the lab wants the newest port there is.
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }\n' \
                    > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg update -f
            pkg install -y autoconf automake pkgconf frr10

          run: |
            set -eux
            cd $GITHUB_WORKSPACE

            # Older than the revision that builds FRR's pimd: there is
            # nothing for this lab to talk to, and nothing a commit here
            # could do about it.
            frr_ver=$(pkg query %v frr10)
            echo "net/frr10 $frr_ver"
            if [ "$(pkg version -t "$frr_ver" 10.7.1_1)" = "<" ]; then
                    echo "SKIP: net/frr10 $frr_ver has no pimd, 10.7.1_1 is the"
                    echo "      first revision that builds it; nothing to run."
                    exit 0
            fi

            kldload -n ip_mroute
            kldload -n if_bridge

            ./autogen.sh
            ./configure --prefix= --enable-test
            make V=1

            # Already root in the VM, so the script's sudo wrapper is empty.
            # Two scenarios at a time, as the lab job above and for the same
            # reason: four vCPUs, and every assertion is a poll against a
            # timeout.
            #
            # This lab leaves a failed scenario's work directory where it
            # is rather than renaming it, and copyback is off, so the logs
            # are printed here or the VM takes them with it.
            SUDO= sh test/frr-interop.sh -j 2 run all || rc=$?

            if [ -n "${rc:-}" ]; then
                    for f in /tmp/pimd-frr*/*.log; do
                            test -f "$f" || continue
                            echo "===== $f ====="
                            tail -n 200 "$f"
                    done
            fi

            exit ${rc:-0}
