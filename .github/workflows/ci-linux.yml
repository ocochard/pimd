name: CI-Linux

# Run on all branches, including all pull requests, except the 'dev'
# branch since that's where we run Coverity Scan (limited tokens/day)
on:
  push:
    branches:
      - '**'
      - '!dev'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    # Verify we can build on Ubuntu 26.04 with both gcc and clang
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        compiler: [gcc, clang]
      fail-fast: false
    env:
      MAKEFLAGS: -j3
      CC: ${{ matrix.compiler }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install pkg-config libsystemd-dev tree
      - uses: actions/checkout@v7
      - name: Configure
        # Build in a sub-directory so we can safely set a+w on all
        # directories.  Needed for `make check` since it runs with
        # root dropped and wants to write .trs and .log files.
        #
        # --enable-werror here and not in the shipped default: a release
        # tarball built with -Werror stops building on the next compiler,
        # on a machine where nobody can edit the Makefile.  The warning
        # set itself is probed in configure.ac, so gcc and clang each get
        # what they take.
        run: |
          ./autogen.sh
          ./configure --prefix= --enable-test --enable-werror
      - name: Build
        run: |
          make V=1
      - name: Install
        run: |
          DESTDIR=~/tmp make install-strip
          tree ~/tmp
          ldd ~/tmp/sbin/pimd
          size ~/tmp/sbin/pimd
          ldd ~/tmp/sbin/pimctl
          size ~/tmp/sbin/pimctl
          sudo ~/tmp/sbin/pimd -p ~/tmp/foo.pid -u ~/tmp/foo.sock
          sleep 1
          ~/tmp/sbin/pimd -h
          sudo ~/tmp/sbin/pimctl -u ~/tmp/foo.sock -h
          sudo ~/tmp/sbin/pimctl -u ~/tmp/foo.sock
          sudo ~/tmp/sbin/pimctl -u ~/tmp/foo.sock kill
      # No test step: TESTS is empty, every script that was in it being a
      # scenario of test/lab.sh now, which the lab job below runs.

  cocci:
    # Coccinelle over src/ and lib/: the machine-decidable part of
    # doc/security-review-prompt.md, plus the patterns that are about this
    # tree rather than about C -- a receive_pim_*() that never bounds its
    # len, an s1..s4 log buffer formatted twice in one call, a uvifs[]
    # subscript that was never tested against NO_VIF.
    #
    # Needs no build, so it does not wait on one, and it is a job of its own
    # so a hit reports as a hit rather than as a build failure.
    name: Coccinelle
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install coccinelle
      - name: Run rules/security.cocci
        run: ./rules/run.sh

  analyzer:
    # gcc's own path-sensitive analyser, -fanalyzer, which walks each
    # function's execution paths rather than pattern matching over its
    # text.  It is a job of its own and not a flag on the build above for
    # the same reason the Coccinelle job is one: a finding should report as
    # a finding rather than as a failed build of something else.
    #
    # On every push, because it costs seconds: the whole tree analysed is
    # under five seconds at -j3 on a 2026 gcc, this being fifteen thousand
    # lines and gcc 15's analyser being far quicker than the one that
    # shipped in gcc 12.
    #
    # --enable-werror, so that a new finding fails rather than scrolls past
    # -- this is a CI job and not a tarball build, so a future gcc that
    # finds something new is a signal and not a packager's problem.
    # -Wno-analyzer-too-complex is the exception: that one says the
    # analyser gave up on a function, which is worth knowing and is not a
    # bug in the daemon, and pim_proto.c is exactly the size that provokes
    # it.
    #
    # gcc only, clang having no -fanalyzer; the clang side of the same
    # question is scan-build, which is not here yet.
    name: gcc -fanalyzer
    runs-on: ubuntu-26.04
    env:
      MAKEFLAGS: -j3
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install pkg-config libsystemd-dev
      - name: Build with the analyser
        run: |
          ./autogen.sh
          ./configure --prefix= --enable-werror CC=gcc			\
              CFLAGS="-O2 -g -fanalyzer -Wno-analyzer-too-complex"
          make V=1

  fuzz:
    # The in-process harnesses of test/fuzz/, which is the only job that
    # runs anything out of TESTS: the build above configures --enable-test,
    # where TESTS is empty, and the corpus replay needs --enable-fuzz to
    # exist at all.  Without this, every crasher ever committed under
    # test/fuzz/corpus/ is a file nothing reads.
    #
    # Two halves.  The replay is the regression test -- every seed and every
    # crasher through each of the _replay drivers, under
    # -fsanitize=address,undefined, which is what makes the verdict more than
    # "did not segfault" -- and it is deterministic, so a failure here is a
    # bug somebody introduced.  The short hunt after it is the opposite: it
    # looks for something new, from a fixed -seed so that what it finds can
    # be sent again, and a failure is a find rather than a flake.  Both are
    # minutes, so this is a job of its own and does not hold up the build.
    #
    # LeakSanitizer is left off, although Linux is where it would work: the
    # harnesses give back what an input allocated, but each of them keeps
    # buffers and a configuration from start-up to exit the way pimd does,
    # so what LSan reports at exit needs a human to read rather than a job
    # to fail on.  ASAN_OPTIONS=detect_leaks=1 by hand is how to look.
    name: Fuzz harnesses
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      MAKEFLAGS: -j3
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install pkg-config libsystemd-dev clang

      - name: Build
        run: |
          ./autogen.sh
          ./configure --enable-fuzz --enable-werror CC=clang		\
              CFLAGS="-g -O1 -fno-omit-frame-pointer -fno-strict-aliasing -fsanitize=address,undefined" \
              LDFLAGS="-fsanitize=address,undefined"
          make V=1

      - name: Replay the committed corpus
        run: |
          make check || rc=$?
          cat test/test-suite.log test/fuzz-corpus.sh.log 2>/dev/null
          exit ${rc:-0}

      - name: Hunt for a minute per harness
        run: |
          mkdir -p work/config work/pim work/igmp work/ipc
          test/fuzz_config -max_len=4096 -max_total_time=60 -seed=1	\
              -artifact_prefix=$PWD/ work/config test/fuzz/corpus/config
          test/fuzz_pim -max_len=512 -max_total_time=60 -seed=1		\
              -artifact_prefix=$PWD/ work/pim test/fuzz/corpus/pim
          test/fuzz_igmp -max_len=512 -max_total_time=60 -seed=1		\
              -artifact_prefix=$PWD/ work/igmp test/fuzz/corpus/igmp
          test/fuzz_ipc -max_len=1024 -max_total_time=60 -seed=1		\
              -artifact_prefix=$PWD/ work/ipc test/fuzz/corpus/ipc

      - name: Keep whatever it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  lab:
    # The network namespace lab: twenty-one PIM-SM scenarios over real
    # namespaces, veth pairs and bridges, asserting on forwarded traffic and
    # on the kernel MFC in each namespace.  The suite above cannot hold them:
    # automake runs it under an unprivileged `unshare`, and a lab box has to
    # outlive the command that built it, so the lab wants real root and named
    # namespaces.  test/lab.sh is the same file the FreeBSD job runs, the two
    # backends differing only in how a box, a link or an address is made.
    #
    # A job of its own rather than another step of the build, because even
    # two at a time it takes far longer than the build, which should report
    # without waiting for it.
    name: Lab on Linux
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install pkg-config libsystemd-dev ethtool iproute2 tcpdump

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix= --enable-test
          make V=1

      - name: Run the network namespace lab
        # Under sudo the script's own sudo wrapper is empty, and the boxes,
        # links and daemons are all root's.
        #
        # Two scenarios at a time: this runner has four vCPUs, every
        # assertion in the lab is a poll against a timeout, and what a lab
        # too crowded to converge loses is a deadline rather than time.  It
        # is most of the win either way, keepalive having to outlive
        # PIM_DATA_TIMEOUT whatever else runs beside it.
        #
        # A scenario that fails keeps its work directory, one pimd log per
        # router and the captures; print them here, or a failed run leaves
        # nothing but the assertion that tripped.  The slot is part of the
        # name, slot 0 being /tmp/pimd-test, so the glob has to reach past it.
        run: |
          sudo sh test/lab.sh -j 2 run all || rc=$?
          for d in /tmp/pimd-test*.*.failed; do
                  test -d "$d" || continue
                  for f in "$d"/*.log; do
                          test -f "$f" || continue
                          echo "===== $f ====="
                          sudo tail -n 200 "$f"
                  done
          done
          exit ${rc:-0}
