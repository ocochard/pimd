name: Release General

# A tag of three numbers is a release: this builds the tarball from it and
# publishes both, with the top entry of ChangeLog.md as the release text.
# Nothing else here runs on tags -- ci-linux.yml and ci-freebsd.yml watch
# branches -- so push the branch and let those go green before tagging.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      # Full history, tags included: `make release` refuses to build a
      # tarball whose version it cannot find a tag for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installing dependencies ...
        run: |
          sudo apt-get -y update
          sudo apt-get -y install pkg-config libsystemd-dev
      - name: Extract ChangeLog entry ...
        # Hack to extract latest entry for body_path below
        run: |
          awk '/-----*/{if (x == 1) exit; x=1;next}x' ChangeLog.md \
              |head -n -1 > release.md
          cat release.md
      - name: Creating Makefiles ...
        run: |
          ./autogen.sh
          ./configure --prefix=
      - name: Build release ...
        run: |
          make release
          ls -lF ../
          mkdir -p artifacts/
          mv ../*.tar.* artifacts/
      - name: Create release ...
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: pimd v${{ github.ref_name }}
          body_path: release.md
          draft: false
          prerelease: false
          files: artifacts/*
