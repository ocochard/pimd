# Exmaple configuration file for pimd, the original PIM-SM router
#
# See the pimd(8) man page for details on all the settings.  This file
# only gives very brief examples and is intended as a quick start.
#
# By default PIM is activated on all interfaces, useful in small and/or
# dedicated setups.  Use `phyint ifname disable` per interface where PIM
# should not run, or `no phyint` followed by `phyint ifname enable` to
# get the inverse behavior.
#
# NOTE: The order of the settings matter!
#
##
# default-route-distance <1-255>
# default-route-metric   <1-1024>
# assert-preference      [configured | rib]
# autorp discovery       [enable | disable]
# autorp announce        ADDR [interval SEC] [holdtime SEC] [scope TTL]
# autorp group-prefix    GROUP [masklen LEN] [deny]
# autorp mapping-agent   ADDR [interval SEC] [holdtime SEC] [scope TTL]
# autorp-limit           <0-1000000>
# hello-interval         <30-18724>
# rpt-prune-limit        <0-1000000>
# local-sg-limit         <0-1000000>
# register-sg-limit      <0-1000000>
#
# igmp-query-interval  <SEC>
# igmp-querier-timeout <SEC>
#
# no phyint
#
# phyint <local-addr | ifname> [disable | enable] [igmpv2 | igmpv3]
#        [dr-priority <1-4294967294>]
#        [ttl-threshold <1-255>] [distance <1-255>] [metric <1-1024>]
#        [altnet <network> [/<masklen> | masklen <masklen>]]
#        [accept-nbr-from <address> [/<masklen> | masklen <masklen>]]
#        [scoped <network> [/<masklen> | masklen <masklen>]]
#
# bsr-candidate [local-addr | ifname] [priority <0-255>] [interval <10-26214>]
# rp-candidate  [local-addr | ifname] [priority <0-255> ] [interval <10-16383>]
#                group-prefix <group-addr>[/<masklen> | masklen <masklen>]
#                group-prefix <group-addr>[/<masklen> | masklen <masklen>]
#                   .
#                   .
#                group-prefix <group-addr>[/<masklen> | masklen <masklen>]
# rp-address    <local-addr> [<group-addr>[/<masklen> | masklen <masklen>]
#
# register-accept-from <addr>[/<masklen> | masklen <masklen>]
#
# anycast-rp    <anycast-addr> <member-addr>
#
# spt-threshold [rate <KBPS> | packets <NUM> | infinity] [interval <SEC>]
#
# ssm-range     default | <group-addr>[/<masklen> | masklen <masklen>]
##
#
# The routing protocol admin distance (or metric preference per the RFC)
# is used in PIM Assert elections to elect the forwarder of multicast.
# pimd only takes the distance from the routing table when asked to, with
# `assert-preference rib` below, and cannot take it there at all unless it
# was built --enable-netlink, so it may need to be configured per
# interface.  If left out, the default-route-distance is used for the
# phyint.  In PIM assert elections
# the router advertising the lowest preference (distance) will be
# selected as forwarder (upstream router) for that LAN.  An admin
# distance of 101 should be sufficiently high so that asserts from Cisco
# or GateD routers are prefered over poor-little pimd.
#
# The metric beside it is the metric of the route to the source, read
# from the kernel routing table (the route priority on Linux, the per
# route metric on FreeBSD).  The metric settings below are the fallback
# for a system that reports neither, and default to 1024.
#
# assert-preference rib takes the preference from the routing table too:
# the kernel says which protocol installed the route and pimd advertises
# the distance that protocol is conventionally given, 0 connected, 1
# static, 20 BGP, 90 EIGRP, 110 OSPF, 115 IS-IS, 120 RIP, which is what a
# Cisco or an Arista on the same LAN advertises for the same route.  Only
# a netlink build can read it, and RFC 7761 sec. 4.6.3 compares the
# preference before the metric, so a router that derives one always beats
# a router that cannot: turn it on domain-wide or not at all.  Default:
# configured, i.e. the number above for every route.
#
# assert-preference [configured | rib]
#
# Auto-RP is the other way an RP is learned: a mapping agent somewhere in
# the domain sends the group-to-RP mappings to 224.0.1.40 (UDP port 496)
# and every router listens.  pimd listens by default, puts what it hears in
# the same RP set the bootstrap mechanism fills, and `pimctl show autorp`
# says what came from where.  An rp-address configured here always wins
# over a mapping for the same groups.  A negative prefix -- a deny -- means
# dense mode in the specification, and pimd reads it as "no RP for these
# groups", which is what a sparse-only daemon can honestly do.  This is the
# listening half only: pimd neither announces itself over Auto-RP nor acts
# as a mapping agent.  autorp-limit caps the mappings one unauthenticated
# domain can make this router hold.
#
# pimd can take the other two roles as well: `autorp announce ADDR' makes it
# a candidate RP over Auto-RP, with one `autorp group-prefix' line per range
# it offers to serve (`deny' making it a negative prefix, the one thing
# Auto-RP says that a Bootstrap cannot), and `autorp mapping-agent ADDR'
# makes it the agent that resolves what the candidates claim and tells the
# domain.  Both take interval, holdtime and scope, defaulting to 60 seconds,
# three intervals and a TTL of 15.  Both messages go out of every PIM
# interface, pimd having no dense mode to flood them with.
#
# autorp discovery     [enable | disable]
# autorp announce      ADDR [interval SEC] [holdtime SEC] [scope TTL]
# autorp group-prefix  GROUP [masklen LEN] [deny]
# autorp mapping-agent ADDR [interval SEC] [holdtime SEC] [scope TTL]
# autorp-limit         <0-1000000>
#
# Use the disable-vifs keyword before any phyint directive to change the
# default for all interfaces to disabled.  I.e., pimd does not create a
# multicast VIF for all interfaces.  Then use `phyint ifname enable` to
# selectively enable each interface for multicast routing.
#
# A phyint directive can use either the interface name, ifname, or the
# IP address.  It may name an interface that does not exist yet: pimd
# rescans the kernel interface list while it runs, so a link negotiated
# after it started -- PPP, L2TP, a tunnel coming up -- gets a VIF and the
# settings on its phyint line when it appears.  The distance and metric
# settings define administrative
# distance and metric, respectively, for PIM Assert messages sent on
# that interface.  Usually you do not need this, but if you do, think of
# them like distance and metric defined on an inbound interface (iif),
# but used by PIM Asserts on the outbound interfaces (oifs).
#
# If you want to add "alternative (sub)net" to a physical interface,
# e.g., if you want to make incoming traffic with a non-local source address
# to appear as it is coming from a local subnet, then use the command:
#
#   phyint <local-addr | ifname> altnet <net-addr> masklen <len>
#
# NOTE: if you use this command, make sure you know what you are doing!
#
# A second address on the interface itself does not need this: pimd can
# only create one VIF per interface, so it keeps the subnet of every
# further address as an altnet of that VIF on its own.
#
# To limit which routers pimd will accept PIM messages from on an
# interface, RFC 7761 sec. 6.2, use:
#
#   phyint <local-addr | ifname> accept-nbr-from <addr> [/<len>]
#
# Repeatable on one line, and with no length the address is one router.
# An interface with no accept-nbr-from accepts every router, which the
# same section requires of every option of this kind.  Refusing a Hello
# is what does the work: a Join/Prune, an Assert and a unicast Bootstrap
# are all refused from a router no Hello has been accepted from.
#
# If you want administratively scoped multicast filtering, use the
# following command:
#
#   phyint <local-addr | ifname> scoped <net-addr> masklen <masklen>
#
# This allows interfaces to be configured as an administrative boundary
# for the specified scoped address, or address range.  Packets belonging
# to the scoped range will not be forwarded.
#
# Both rp-candidate and bsr-candidate are enabled in the default config,
# below.  Disabling them for all PIM capable routers is a bad idea.  At
# least one PIM router in the backbone must act as a bootstrap router.
# The optional local-addr or ifname arguments after the rp-candidate and
# bsr-candidate settings specify the local address to be used in the
# Cand-RP and Cand-BSR messages.  In case ifname is given as argument,
# the first IPv4 address of that interface is used.  If either is
# unspecified, the largest local IP address will be used, excluding
# phyint interfaces where PIM has been disabled.
#
# The bsr-candidate interval specifies Cand-BSR advertisement interval,
# the default is 60 sec.  Use smaller values for faster convergence.
# Note that the RP hold time is adjusted to exceed the BSR interval.
#
# The rp-candidate interval specifies Cand-RP advertisement interval,
# the default is 30 sec.  Use smaller values for faster convergence.
#
# The group-prefix setting is the prefix(es) advertised if rp-candidate.
# It is possible to set up to 255 group-prefix records.
#
# Using the rp-address setting it is possible to set a static rendezvous
# point.  The argument can be either a unicast or a multicast address
# followed by an optional group address and optional masklen to that.
#
# The register-accept-from setting lists the routers this RP will accept
# PIM Register messages from.  A Register is unicast, so with none given
# -- the default, and what earlier versions always did -- any host able to
# reach this router can have traffic of its choosing decapsulated onto a
# shared tree it is the RP of.  It matches the sender of the Register, the
# DR, not the source address of the packet inside it.  It is a control
# plane setting: the kernel decapsulates and forwards before pimd sees the
# message, so keeping forged traffic off a shared tree also takes a packet
# filter for IP protocol 103.  See pimd.conf(5).
#
# The anycast-rp setting makes this router one of several RPs sharing one
# RP address, RFC 4610.  Each member also has a unique address, and a
# member copies the Registers it gets from designated routers to the
# others, so the RPs need no MSDP to learn each other's sources.  List
# every member, this router included, with one line each; the lines can
# then be the same on all of them.  See pimd.conf(5) for what each member
# also needs.
#
# The ssm-range setting is the group range handled as Source Specific
# Multicast, 232.0.0.0/8 by default.  Like Cisco's `ip pim ssm range` the
# ranges given replace that default instead of adding to it, so keeping
# 232.0.0.0/8 as well takes an `ssm-range default` line of its own.  All
# routers in the domain should agree on the ranges, PIM does not carry
# them, and receivers on an SSM group need IGMPv3 to name their sources.
#
# The spt-threshold specifies the minimum rate in kbps before the last
# hop router initiates a switch to the shortest path.  The `packets`
# argument is an alternative notation, `infinity` means to never switch,
# and `interval` specifies the interval for periodical testing of the
# threshold.  Currently, `interval` must be at least 5 (seconds)
#
# Interface defaults, like default-route-distance and -metric must be
# set before the phyint section -- the .conf parser is not clever.
#default-route-distance	  101      # smaller is better
#default-route-metric     1024     # smaller is better
#hello-interval           30       # Don't set lower than 30
#rpt-prune-limit          1024     # (S,G,rpt) state neighbors may create
#local-sg-limit           4096     # (S,G) state local sources may create
#register-sg-limit        4096     # (S,G) state Registers may create

# The phyint settings currently *MUST BE* ordered after the default
# source preference and metric settings, but before everything else.
#
# By default, all multicast capable interfaces are enabled.  If you want
# to use loopback, set the interface multicast flag, and give it an
# address outside 127/8 -- RFC 1122 bans a 127/8 address from appearing
# outside a host, so pimd skips any interface that only has one.
#phyint eth0 disable

# IGMP default query interval and querier timeout.  The latter should
# per RFC always be (robustness * interval) + (query-response / 2)
#igmp-query-interval  125
#igmp-querier-timeout 380

# Bigger value means  "higher" priority
bsr-candidate priority 5 interval 30

# Smaller value means "higher" priority (alternate syntax below)
rp-candidate priority 20 interval 30

# Candidate for being RP of complete IPv4 multicast range
# rp-candidate priority 20 interval 30 group-prefix 224.0.0.0 masklen 4

# Static rendez-vous point
#rp-address 192.168.10.1 224.0.0.0/4

# Accept Register messages from the DRs of this site only, instead of from
# anywhere in the network
#register-accept-from 192.168.0.0/16

# One of two anycast RPs for 10.0.0.1, held on a loopback by both, whose
# own addresses are 192.168.10.1 and 192.168.20.1
#rp-address 10.0.0.1
#anycast-rp 10.0.0.1 192.168.10.1
#anycast-rp 10.0.0.1 192.168.20.1

# Source specific multicast on another range than the default 232.0.0.0/8,
# add `ssm-range default` to keep that one in service as well
#ssm-range 239.232.0.0/16

# Switch to shortest-path tree after first packet, but only after 100 sec.
spt-threshold packets 0 interval 100
